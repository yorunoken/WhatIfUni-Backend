[package]
name = "calissaydim-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
dotenvy = "0.15.7"
rosu-v2 = { features = ["serialize"], version = "0.9.0" }
serde = { version = "1.0.208", features = ["derive"] }
sqlx = { version = "0.8.1", features = ["sqlite", "json", "runtime-tokio"] }
tokio = { version = "1.43.1", features = ["full"] }
serde_json = "1.0.125"
warp = "0.3.7"
chrono = "0.4.38"
